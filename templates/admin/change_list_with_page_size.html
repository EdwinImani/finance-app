{% extends "admin/change_list.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    .change-list #result_list tbody tr.row-clickable {
        cursor: pointer;
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        var rows = document.querySelectorAll(".change-list #result_list tbody tr");

        rows.forEach(function (row) {
            var primaryLink = row.querySelector("th a[href], td a[href]");

            if (!primaryLink) {
                return;
            }

            row.classList.add("row-clickable");

            row.addEventListener("click", function (event) {
                if (
                    event.target.closest("a, button, input, select, textarea, label") ||
                    event.target.closest(".action-checkbox, .action-checkbox-column")
                ) {
                    return;
                }

                if (event.ctrlKey || event.metaKey) {
                    window.open(primaryLink.href, "_blank", "noopener");
                    return;
                }

                window.location.href = primaryLink.href;
            });

            row.addEventListener("keydown", function (event) {
                if (event.key !== "Enter" && event.key !== " ") {
                    return;
                }

                if (
                    event.target.closest("a, button, input, select, textarea, label") ||
                    event.target.closest(".action-checkbox, .action-checkbox-column")
                ) {
                    return;
                }

                event.preventDefault();
                window.location.href = primaryLink.href;
            });
        });
    });
</script>
{% endblock %}

{% block search %}
{{ block.super }}
<div class="page-size-toolbar" style="margin: 12px 0 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
    <form method="get" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        {% for key, value in page_size_preserved_filters %}
        <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endfor %}
        <input
            id="page-size-input"
            type="number"
            name="per_page"
            min="1"
            max="500"
            value="{{ current_per_page }}"
            style="width: 88px;"
        >
        <button type="submit" id="page-size-apply">Apply</button>
    </form>
</div>
{% endblock %}
