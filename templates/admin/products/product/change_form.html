{% extends "admin/change_form.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    .change-form .module h2,
    .change-form .module caption,
    .change-form .inline-group h2 {
        font-size: 24px;
    }

    .change-form .form-row,
    .change-form label,
    .change-form input:not([type="checkbox"]):not([type="radio"]),
    .change-form textarea,
    .change-form select,
    .change-form .readonly {
        font-size: 22px !important;
    }

    .change-form input:not([type="checkbox"]):not([type="radio"]),
    .change-form textarea,
    .change-form select {
        min-height: 58px;
        padding: 12px 16px;
    }

    .change-form .readonly {
        display: inline-block;
        min-height: 42px;
        padding: 10px 14px;
    }

    .submit-row input,
    .submit-row a,
    .object-tools a {
        font-size: 21px !important;
        min-height: 48px;
        padding: 0 18px !important;
    }
</style>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var params = new URLSearchParams(window.location.search);
    var returnTo = params.get("_return_to");
    var returnField = params.get("_return_field");
    var returnItemId = params.get("_return_item_id");
    var returnProductAction = params.get("_return_product_action");
    var form = document.querySelector("#content-main form");

    if (returnTo && form && !form.querySelector('input[name="_return_to"]')) {
        var returnInput = document.createElement("input");
        returnInput.type = "hidden";
        returnInput.name = "_return_to";
        returnInput.value = returnTo;
        form.appendChild(returnInput);
    }
    if (returnField && form && !form.querySelector('input[name="_return_field"]')) {
        var fieldInput = document.createElement("input");
        fieldInput.type = "hidden";
        fieldInput.name = "_return_field";
        fieldInput.value = returnField;
        form.appendChild(fieldInput);
    }
    if (returnItemId && form && !form.querySelector('input[name="_return_item_id"]')) {
        var itemInput = document.createElement("input");
        itemInput.type = "hidden";
        itemInput.name = "_return_item_id";
        itemInput.value = returnItemId;
        form.appendChild(itemInput);
    }
    if (returnProductAction && form && !form.querySelector('input[name="_return_product_action"]')) {
        var actionInput = document.createElement("input");
        actionInput.type = "hidden";
        actionInput.name = "_return_product_action";
        actionInput.value = returnProductAction;
        form.appendChild(actionInput);
    }
});
</script>
{% endblock %}
