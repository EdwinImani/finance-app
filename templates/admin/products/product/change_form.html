{% extends "admin/change_form.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    .change-form .module h2,
    .change-form .module caption,
    .change-form .inline-group h2 {
        font-size: 24px;
    }

    .change-form .form-row,
    .change-form label,
    .change-form input:not([type="checkbox"]):not([type="radio"]),
    .change-form textarea,
    .change-form select,
    .change-form .readonly {
        font-size: 22px !important;
    }

    .change-form input:not([type="checkbox"]):not([type="radio"]),
    .change-form textarea,
    .change-form select {
        min-height: 58px;
        padding: 12px 16px;
    }

    .change-form .readonly {
        display: inline-block;
        min-height: 42px;
        padding: 10px 14px;
    }

    .submit-row input,
    .submit-row a,
    .object-tools a {
        font-size: 21px !important;
        min-height: 48px;
        padding: 0 18px !important;
    }

    .product-description-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 8px;
    }

    .product-description-bold {
        min-height: 40px;
        padding: 7px 16px;
        border: 1px solid var(--border-color, #c7c7c7);
        border-radius: 4px;
        background: var(--button-bg, #417690);
        color: var(--button-fg, #fff);
        cursor: pointer;
        font-size: 18px;
        font-weight: 700;
    }

    .product-description-underline {
        min-height: 40px;
        padding: 7px 16px;
        border: 1px solid var(--border-color, #c7c7c7);
        border-radius: 4px;
        background: var(--button-bg, #417690);
        color: var(--button-fg, #fff);
        cursor: pointer;
        font-size: 18px;
        text-decoration: underline;
    }

    .product-description-format-help {
        font-size: 14px;
        color: var(--body-quiet-color, #666);
    }
</style>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var params = new URLSearchParams(window.location.search);
    var returnTo = params.get("_return_to");
    var returnField = params.get("_return_field");
    var returnItemId = params.get("_return_item_id");
    var returnProductAction = params.get("_return_product_action");
    var form = document.querySelector("#content-main form");
    var description = document.getElementById("id_description");

    if (description && !document.querySelector(".product-description-toolbar")) {
        var toolbar = document.createElement("div");
        toolbar.className = "product-description-toolbar";
        toolbar.innerHTML = '<button type="button" class="product-description-bold" title="Make the selected text bold">B Bold</button>' +
            '<button type="button" class="product-description-underline" title="Underline the selected text">U Underline</button>' +
            '<span class="product-description-format-help">Select a word or line, then choose the formatting.</span>';
        description.parentNode.insertBefore(toolbar, description);

        function toggleDescriptionFormat(marker) {
            var start = description.selectionStart;
            var end = description.selectionEnd;
            var value = description.value;
            var selected = value.slice(start, end);
            var alreadyFormatted = start >= marker.length &&
                value.slice(start - marker.length, start) === marker &&
                value.slice(end, end + marker.length) === marker;

            if (alreadyFormatted) {
                description.value = value.slice(0, start - marker.length) + selected + value.slice(end + marker.length);
                description.setSelectionRange(start - marker.length, end - marker.length);
            } else {
                description.value = value.slice(0, start) + marker + selected + marker + value.slice(end);
                description.setSelectionRange(start + marker.length, end + marker.length);
            }

            description.focus();
            description.dispatchEvent(new Event("input", { bubbles: true }));
        }

        toolbar.querySelector(".product-description-bold").addEventListener("click", function() {
            toggleDescriptionFormat("**");
        });

        toolbar.querySelector(".product-description-underline").addEventListener("click", function() {
            toggleDescriptionFormat("__");
        });
    }

    if (returnTo && form && !form.querySelector('input[name="_return_to"]')) {
        var returnInput = document.createElement("input");
        returnInput.type = "hidden";
        returnInput.name = "_return_to";
        returnInput.value = returnTo;
        form.appendChild(returnInput);
    }
    if (returnField && form && !form.querySelector('input[name="_return_field"]')) {
        var fieldInput = document.createElement("input");
        fieldInput.type = "hidden";
        fieldInput.name = "_return_field";
        fieldInput.value = returnField;
        form.appendChild(fieldInput);
    }
    if (returnItemId && form && !form.querySelector('input[name="_return_item_id"]')) {
        var itemInput = document.createElement("input");
        itemInput.type = "hidden";
        itemInput.name = "_return_item_id";
        itemInput.value = returnItemId;
        form.appendChild(itemInput);
    }
    if (returnProductAction && form && !form.querySelector('input[name="_return_product_action"]')) {
        var actionInput = document.createElement("input");
        actionInput.type = "hidden";
        actionInput.name = "_return_product_action";
        actionInput.value = returnProductAction;
        form.appendChild(actionInput);
    }
});
</script>
{% endblock %}
