<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouvelle facture commerciale</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .panel {
            background: #fff;
            border: 1px solid #dce3ef;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(18, 40, 76, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        form p {
            margin-bottom: 14px;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #c9d4e5;
            border-radius: 8px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .button {
            display: inline-block;
            padding: 10px 14px;
            border: 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .primary {
            background: #0b63ce;
            color: #fff;
        }

        .secondary {
            background: #eef3fb;
            color: #172033;
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="panel">
            <h1>Nouvelle facture commerciale</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="actions">
                    <button type="submit" class="button primary">Enregistrer</button>
                    <a href="{% url 'choose_invoice_type' %}" class="button secondary">Retour</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
