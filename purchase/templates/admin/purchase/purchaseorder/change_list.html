{% extends "admin/change_list_with_page_size.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    :root {
        --po-bg: #f7f1ef;
        --po-panel: rgba(255, 255, 255, 0.92);
        --po-border: rgba(217, 119, 6, 0.10);
        --po-text: #23384d;
        --po-muted: #708090;
        --po-accent: #d97706;
        --po-shadow: 0 18px 42px rgba(120, 53, 15, 0.10);
        --po-radius: 18px;
    }

    #content {
        background:
            radial-gradient(circle at top right, rgba(251, 146, 60, 0.12), transparent 28%),
            radial-gradient(circle at top left, rgba(217, 119, 6, 0.10), transparent 24%),
            linear-gradient(180deg, #fdf9f8 0%, var(--po-bg) 100%);
    }

    .change-list #content-main {
        max-width: 1480px;
        width: 100%;
        margin: 0 auto;
        box-sizing: border-box;
    }

    .change-list .object-tools {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
    }

    .change-list .object-tools a {
        border-radius: 999px;
        padding: 10px 16px !important;
        font-weight: 700;
        border: 1px solid transparent;
        box-shadow: none;
    }

    .change-list .object-tools a.addlink {
        background: var(--po-accent) !important;
    }

    .change-list .object-tools li:first-child a {
        background: #fff !important;
        color: var(--po-text) !important;
        border-color: var(--po-border);
    }

    .change-list #changelist {
        background: var(--po-panel);
        border: 1px solid var(--po-border);
        border-radius: var(--po-radius);
        box-shadow: var(--po-shadow);
        overflow: hidden;
        width: 100%;
    }

    .change-list .module.filtered {
        min-height: auto;
    }

    .change-list #changelist .changelist-form-container {
        padding: 18px;
    }

    .change-list #toolbar {
        background: #fffaf9;
        border: 1px solid var(--po-border);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 14px;
    }

    .change-list #toolbar input[type="text"] {
        border-radius: 12px;
        border: 1px solid var(--po-border);
        padding: 10px 12px;
        min-width: 260px;
    }

    .change-list #toolbar input[type="submit"] {
        border-radius: 999px;
        padding: 9px 14px;
    }

    .change-list .page-size-toolbar form {
        background: #fffaf9;
        border: 1px solid var(--po-border);
        border-radius: 999px;
        padding: 8px 12px;
    }

    .change-list .page-size-toolbar select,
    .change-list .page-size-toolbar input,
    .change-list .page-size-toolbar button {
        border-radius: 999px;
        border: 1px solid var(--po-border);
        padding: 7px 10px;
        background: #fff;
    }

    .change-list .actions {
        background: #fffaf9;
        border: 1px solid var(--po-border);
        border-radius: 14px;
        padding: 10px 14px;
        margin-bottom: 14px;
    }

    .change-list #result_list {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        border: 1px solid var(--po-border);
        border-radius: 16px;
    }

    .change-list #result_list thead th {
        background: #ffedd5;
        color: #9a3412;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 11px;
        padding-top: 12px;
        padding-bottom: 12px;
    }

    .change-list #result_list tbody tr:nth-child(even) {
        background: #fffefb;
    }

    .change-list #result_list tbody tr:hover {
        background: #fff3e0;
    }

    .change-list #result_list tbody th,
    .change-list #result_list tbody td {
        padding-top: 12px;
        padding-bottom: 12px;
        color: var(--po-text);
    }

    .change-list #result_list tbody th a {
        color: #7f1f28;
        font-weight: 700;
    }

    .change-list #result_list .column-pdf_link {
        width: 86px;
        text-align: center;
    }

    .purchase-list-pdf-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid rgba(217, 119, 6, 0.24);
        background: #fff7ed;
        color: #9a3412 !important;
        font-size: 11px;
        font-weight: 800;
        line-height: 1;
        text-decoration: none !important;
        box-shadow: 0 8px 16px rgba(180, 83, 9, 0.08);
    }

    .purchase-list-pdf-button:hover {
        background: #ffedd5;
        border-color: rgba(217, 119, 6, 0.40);
    }

    .change-list .paginator {
        margin-top: 14px;
        background: #fffaf9;
        border: 1px solid var(--po-border);
        border-radius: 14px;
        padding: 12px 14px;
    }

    .change-list #changelist-filter {
        background: linear-gradient(180deg, #ffffff 0%, #fff7ed 100%);
        border-left: 1px solid var(--po-border);
        padding: 18px 16px;
    }

    .change-list #changelist-filter h2,
    .change-list #changelist-filter h3 {
        color: #9a3412;
    }

    .purchase-list-hero {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 18px;
        margin-bottom: 16px;
    }

    .purchase-list-hero h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.1;
        letter-spacing: -0.03em;
        color: var(--po-text);
    }

    @media (max-width: 900px) {
        .purchase-list-hero {
            flex-direction: column;
        }

        .change-list #toolbar input[type="text"] {
            min-width: 0;
            width: 100%;
        }
    }
</style>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var form = document.getElementById("changelist-form");
    if (form) {
        form.addEventListener("submit", function(event) {
            var action = form.querySelector('select[name="action"]');
            if (!action || action.value !== "delete_selected") {
                return;
            }

            var selectedRows = form.querySelectorAll('input.action-select:checked');
            var selectAcross = form.querySelector('input[name="select_across"]');
            var selectedAcross = selectAcross && selectAcross.value === "1";
            if (!selectedRows.length && !selectedAcross) {
                return;
            }

            var confirmed = window.confirm("Are you sure you want to delete the selected purchase orders?");
            if (!confirmed) {
                event.preventDefault();
                return;
            }

            if (!form.querySelector('input[name="post"]')) {
                var postInput = document.createElement("input");
                postInput.type = "hidden";
                postInput.name = "post";
                postInput.value = "yes";
                form.appendChild(postInput);
            }
        });
    }

    document.querySelectorAll(".change-list .paginator").forEach(function(paginator) {
        Array.from(paginator.childNodes).forEach(function(node) {
            if (node.nodeType !== Node.TEXT_NODE) {
                return;
            }

            if (node.textContent.toLowerCase().includes("purchase order")) {
                node.textContent = "";
            }
        });
    });
});
</script>
{% endblock %}

{% block content_title %}
<div class="purchase-list-hero">
    <div>
        <h1>Purchase Orders</h1>
    </div>
</div>
{% endblock %}

{% block object-tools-items %}
<li>
    <a href="report/">Purchase Report</a>
</li>
{{ block.super }}
{% endblock %}
