{% extends "admin/change_form.html" %}

{% block extrahead %}
{{ block.super }}
{% if invoice_autosave_url %}
<script>
    window.invoiceAutosaveConfig = {
        url: "{{ invoice_autosave_url|escapejs }}"
    };
</script>
{% endif %}
<style>
    .partner-autosave-status {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        margin: 0 0 14px;
        padding: 0 12px;
        border-radius: 999px;
        background: #fff7ed;
        border: 1px solid rgba(217, 119, 6, 0.14);
        color: #9a3412;
        font-size: 13px;
        font-weight: 700;
    }

    .partner-autosave-status.is-saving {
        color: #9a3412;
    }

    .partner-autosave-status.is-error {
        color: #b91c1c;
    }

    .change-form .form-row.field-partner_type select,
    .change-form #id_partner_type {
        width: 360px;
        max-width: 100%;
        min-height: 58px;
        padding: 12px 18px;
        font-size: 18px !important;
        line-height: 1.5 !important;
    }

    .change-form .form-row.field-partner_type select option,
    .change-form #id_partner_type option {
        min-height: 58px;
        padding: 18px 18px !important;
        font: 26px Arial, sans-serif !important;
        line-height: 2 !important;
    }

    .change-form .module h2,
    .change-form .module caption,
    .change-form .inline-group h2 {
        font-size: 24px;
    }

    .change-form .form-row,
    .change-form label,
    .change-form input:not([type="checkbox"]):not([type="radio"]),
    .change-form textarea,
    .change-form select,
    .change-form .readonly,
    .inline-group .tabular th,
    .inline-group .tabular td {
        font-size: 22px !important;
    }

    .change-form input:not([type="checkbox"]):not([type="radio"]),
    .change-form textarea,
    .change-form select {
        min-height: 58px;
        padding: 12px 16px;
    }

    .inline-group .tabular input:not([type="checkbox"]):not([type="radio"]),
    .inline-group .tabular select {
        min-height: 52px;
        font-size: 20px !important;
    }

    .partner-autosave-status,
    .submit-row input,
    .submit-row a,
    .object-tools a,
    .inline-group .add-row a {
        font-size: 21px !important;
    }

    .partner-autosave-status,
    .submit-row input,
    .submit-row a,
    .object-tools a {
        min-height: 48px;
        padding: 0 18px !important;
    }
</style>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var partnerTypeSelect = document.querySelector("#id_partner_type");
    if (partnerTypeSelect) {
        partnerTypeSelect.style.fontSize = "18px";
        partnerTypeSelect.style.lineHeight = "1.5";
        partnerTypeSelect.style.minHeight = "58px";

        Array.from(partnerTypeSelect.options).forEach(function(option) {
            option.style.font = "26px Arial, sans-serif";
            option.style.fontSize = "26px";
            option.style.lineHeight = "2";
            option.style.padding = "18px";
        });
    }

    var deleteButton = document.querySelector(".submit-row a.deletelink");
    if (!deleteButton) {
        return;
    }

    deleteButton.addEventListener("click", function(event) {
        event.preventDefault();

        var confirmed = window.confirm("Are you sure you want to delete this partner?");
        if (!confirmed) {
            return;
        }

        var csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
        var deleteForm = document.createElement("form");
        deleteForm.method = "post";
        deleteForm.action = deleteButton.href;
        deleteForm.style.display = "none";

        if (csrfInput) {
            var csrfClone = document.createElement("input");
            csrfClone.type = "hidden";
            csrfClone.name = "csrfmiddlewaretoken";
            csrfClone.value = csrfInput.value;
            deleteForm.appendChild(csrfClone);
        }

        var postInput = document.createElement("input");
        postInput.type = "hidden";
        postInput.name = "post";
        postInput.value = "yes";
        deleteForm.appendChild(postInput);

        document.body.appendChild(deleteForm);
        deleteForm.submit();
    });
});
</script>
{% endblock %}
