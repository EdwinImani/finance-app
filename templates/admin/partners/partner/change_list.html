{% extends "admin/change_list_with_page_size.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    :root {
        --partner-bg: #f7f1ef;
        --partner-panel: rgba(255, 255, 255, 0.92);
        --partner-border: rgba(217, 119, 6, 0.10);
        --partner-text: #23384d;
        --partner-muted: #708090;
        --partner-accent: #d97706;
        --partner-shadow: 0 18px 42px rgba(120, 53, 15, 0.10);
        --partner-radius: 18px;
    }

    #content {
        background:
            radial-gradient(circle at top left, rgba(251, 146, 60, 0.12), transparent 28%),
            radial-gradient(circle at top right, rgba(217, 119, 6, 0.10), transparent 24%),
            linear-gradient(180deg, #fdf9f8 0%, var(--partner-bg) 100%);
    }

    .change-list #content-main {
        max-width: 1480px;
        margin: 0 auto;
    }

    .change-list .object-tools {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
    }

    .change-list .object-tools a {
        border-radius: 999px;
        padding: 11px 18px !important;
        font-weight: 800;
        border: 1px solid #b45309;
        box-shadow: 0 10px 18px rgba(180, 83, 9, 0.16);
        letter-spacing: 0.03em;
        text-transform: uppercase;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .change-list .object-tools a.addlink {
        background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%) !important;
        color: #fff !important;
    }

    .change-list .object-tools a.addlink::before {
        content: "+";
        font-size: 18px;
        line-height: 1;
        font-weight: 900;
    }

    .change-list .object-tools a:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 24px rgba(180, 83, 9, 0.2);
    }

    .change-list #changelist {
        background: var(--partner-panel);
        border: 1px solid var(--partner-border);
        border-radius: var(--partner-radius);
        box-shadow: var(--partner-shadow);
        overflow: hidden;
    }

    .change-list .module.filtered {
        min-height: auto;
    }

    .change-list #changelist .changelist-form-container {
        padding: 18px;
    }

    .change-list #toolbar {
        background: #fffaf4;
        border: 1px solid var(--partner-border);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 14px;
    }

    .change-list #toolbar input[type="text"] {
        border-radius: 12px;
        border: 1px solid var(--partner-border);
        padding: 10px 12px;
        min-width: 260px;
    }

    .change-list #toolbar input[type="submit"] {
        border-radius: 999px;
        padding: 9px 14px;
    }

    .change-list .page-size-toolbar form {
        background: #fbf9f3;
        border: 1px solid var(--partner-border);
        border-radius: 999px;
        padding: 8px 12px;
    }

    .change-list .page-size-toolbar input,
    .change-list .page-size-toolbar button {
        border-radius: 999px;
        border: 1px solid var(--partner-border);
        padding: 7px 10px;
        background: #fff;
    }

    .change-list .actions {
        background: #fff7ed;
        border: 1px solid var(--partner-border);
        border-radius: 14px;
        padding: 10px 14px;
        margin-bottom: 14px;
    }

    .change-list #result_list {
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        border: 1px solid var(--partner-border);
        border-radius: 16px;
    }

    .change-list #result_list thead th {
        background: #ffedd5;
        color: #9a3412;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 11px;
        padding-top: 12px;
        padding-bottom: 12px;
    }

    .change-list #result_list tbody tr:nth-child(even) {
        background: #fffefb;
    }

    .change-list #result_list tbody tr:hover {
        background: #fff3e0;
    }

    .change-list #result_list tbody th,
    .change-list #result_list tbody td {
        padding-top: 12px;
        padding-bottom: 12px;
        color: var(--partner-text);
    }

    .change-list #result_list tbody th a {
        color: #9a3412;
        font-weight: 700;
    }

    .change-list .paginator {
        margin-top: 14px;
        background: #fbf9f3;
        border: 1px solid var(--partner-border);
        border-radius: 14px;
        padding: 12px 14px;
    }

    .change-list #changelist-filter {
        background: linear-gradient(180deg, #fffefb 0%, #fff7ed 100%);
        border-left: 1px solid var(--partner-border);
        padding: 18px 16px;
    }

    .change-list #changelist-filter h2,
    .change-list #changelist-filter h3 {
        color: #9a3412;
    }

    .partner-list-hero {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 18px;
        margin-bottom: 16px;
    }

    .partner-list-hero h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.1;
        letter-spacing: -0.03em;
        color: #9a3412;
    }

    .partner-list-hero p {
        margin: 10px 0 0;
        color: var(--partner-muted);
        font-size: 14px;
        max-width: 720px;
    }

    .partner-list-hero h1 {
        font-size: 52px;
    }

    .partner-list-hero p,
    .change-list .object-tools a,
    .change-list #toolbar input[type="text"],
    .change-list #toolbar input[type="submit"],
    .change-list .page-size-toolbar,
    .change-list .page-size-toolbar input,
    .change-list .page-size-toolbar button,
    .change-list .actions,
    .change-list .actions select,
    .change-list .actions button,
    .change-list .paginator,
    .change-list #changelist-filter {
        font-size: 21px;
    }

    .change-list #toolbar input[type="text"],
    .change-list #toolbar input[type="submit"],
    .change-list .page-size-toolbar input,
    .change-list .page-size-toolbar button,
    .change-list .actions select,
    .change-list .actions button {
        min-height: 52px;
    }

    .change-list #result_list thead th {
        font-size: 20px;
        padding-top: 18px;
        padding-bottom: 18px;
    }

    .change-list #result_list tbody th,
    .change-list #result_list tbody td,
    .change-list #result_list tbody th a,
    .change-list #result_list tbody td a {
        font-size: 22px;
        line-height: 1.35;
    }

    .change-list #result_list tbody th,
    .change-list #result_list tbody td {
        padding-top: 18px;
        padding-bottom: 18px;
    }

    .change-list #changelist-filter h2,
    .change-list #changelist-filter h3 {
        font-size: 22px;
    }

    @media (max-width: 900px) {
        .partner-list-hero {
            flex-direction: column;
        }

        .change-list #toolbar input[type="text"] {
            min-width: 0;
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block content_title %}
<div class="partner-list-hero">
    <div>
        <h1>Partners</h1>
    </div>
</div>
{% endblock %}
