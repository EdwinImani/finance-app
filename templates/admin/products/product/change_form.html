{% extends "admin/change_form.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    .change-form .module h2,
    .change-form .module caption,
    .change-form .inline-group h2 {
        font-size: 24px;
    }

    .change-form .form-row,
    .change-form label,
    .change-form input:not([type="checkbox"]):not([type="radio"]),
    .change-form textarea,
    .change-form select,
    .change-form .readonly {
        font-size: 22px !important;
    }

    .change-form input:not([type="checkbox"]):not([type="radio"]),
    .change-form textarea,
    .change-form select {
        min-height: 58px;
        padding: 12px 16px;
    }

    .change-form .readonly {
        display: inline-block;
        min-height: 42px;
        padding: 10px 14px;
    }

    .submit-row input,
    .submit-row a,
    .object-tools a {
        font-size: 21px !important;
        min-height: 48px;
        padding: 0 18px !important;
    }
</style>
{% endblock %}
